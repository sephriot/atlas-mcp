[package]
name = "atlas-mcp"
version = "0.1.0"
edition = "2021"
description = "Centralized knowledge management MCP server"
license = "MIT"

[dependencies]
rmcp = { version = "0.14", features = ["server", "transport-streamable-http-server", "transport-io"] }
tokio-util = { version = "0.7", features = ["rt"] }
serde_json = "1"
anyhow = "1"
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9.33"
schemars = "1.2"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
fs2 = "0.4"
axum = "0.8"
regex = "1"
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
