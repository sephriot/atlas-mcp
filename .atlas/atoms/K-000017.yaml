id: K-000017
title: rmcp 1.x upgrade requires builder-style server metadata and HTTP config
type: recipe
confidence: high
summary: 'Upgrading this project from `rmcp 0.14` to `1.x` was a small migration. Two code changes were required: construct `StreamableHttpServerConfig` via `Default` plus fluent setters instead of a struct literal because the type is now `#[non_exhaustive]` and includes `json_response`; construct `ServerInfo` and `Implementation` via `ServerInfo::new(...)` / `Implementation::new(...)` plus `.with_*` setters because those structs are also `#[non_exhaustive]` and `Implementation` now includes `description`. After these changes, `cargo test` and `cargo clippy -- -D warnings` passed unchanged.'
